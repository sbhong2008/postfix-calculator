<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포스트픽스 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: 계산기 카드(입력·키패드) 옆에 계산 기록 패널. 좁은 화면에서는 위아래로 쌓음. */
  :root {
    --bg: #eceff1;
    --surface: #fafbfb;
    --ink: #1a2428;
    --muted: #5a6a72;
    --key: #e2e8eb;
    --key-op: #cfdadf;
    --key-hover: #d6dfe3;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --danger: #b3261e;
    --line: #cbd6db;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11171a; --surface: #192125; --ink: #e6edf0; --muted: #93a3ab;
      --key: #263137; --key-op: #314047; --key-hover: #3a4b53;
      --accent: #3fc1b0; --accent-ink: #08201c; --danger: #ff8a80; --line: #33434b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11171a; --surface: #192125; --ink: #e6edf0; --muted: #93a3ab;
    --key: #263137; --key-op: #314047; --key-hover: #3a4b53;
    --accent: #3fc1b0; --accent-ink: #08201c; --danger: #ff8a80; --line: #33434b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px;
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .shell { max-width: 860px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); align-items: start; }
  @media (max-width: 760px) { .shell { grid-template-columns: minmax(0, 1fr); } }

  .calc, .history { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .calc { padding: 14px; display: grid; gap: 12px; }

  .bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .modes { display: inline-flex; flex-wrap: wrap; background: var(--key); border-radius: 9px; padding: 3px; gap: 2px; }
  .modes button, .pill {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--muted);
    background: transparent; border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer;
  }
  .modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .pill { background: var(--key); }
  .pill:hover { background: var(--key-hover); }

  [hidden] { display: none !important; }
  .cv-all span { word-break: keep-all; }
  .screen { background: var(--bg); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; min-height: 148px; align-content: end; text-align: right; }
  .prev { font-family: var(--mono); font-size: 13px; color: var(--muted); min-height: 18px; overflow-wrap: anywhere; }
  .expr { font-family: var(--mono); font-size: 30px; font-weight: 500; line-height: 1.2; overflow-wrap: anywhere; min-height: 36px; }
  .expr.long { font-size: 22px; }
  .live { font-family: var(--mono); font-size: 18px; color: var(--accent); min-height: 26px; overflow-wrap: anywhere; }
  .live.err { color: var(--danger); font-family: var(--sans); font-size: 14px; }
  .rpn { font-family: var(--mono); font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 6px; overflow-wrap: anywhere; min-height: 24px; }
  .rpn b { font-family: var(--sans); font-weight: 600; margin-right: 6px; }
  .bases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: left; margin-top: 6px; }
  .bases span { overflow-wrap: anywhere; }
  .bases b { font-family: var(--sans); color: var(--ink); margin-right: 6px; }

  .keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .keys.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .keys.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  button.k {
    font-family: var(--mono); font-size: 18px; font-weight: 500; color: var(--ink);
    background: var(--key); border: 0; border-radius: 10px; min-height: 50px; cursor: pointer;
    transition: background .12s;
  }
  button.k:hover { background: var(--key-hover); }
  button.k:active { transform: translateY(1px); }
  button.k.op { background: var(--key-op); }
  button.k.fn { font-size: 15px; background: var(--key-op); }
  button.k.eq { background: var(--accent); color: var(--accent-ink); }
  button.k.eq:hover { filter: brightness(1.08); }
  button.k:disabled { opacity: .35; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .history { padding: 14px; min-height: 120px; }
  .history h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .history header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .history ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
  .history li button { width: 100%; text-align: right; font-family: var(--mono); font-size: 14px; color: var(--ink); background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; overflow-wrap: anywhere; }
  .history li button:hover { background: var(--key); }
  .history li small { display: block; color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .conv { display: grid; gap: 12px; }
  .cv-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: stretch; }
  .conv input, .conv select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; width: 100%; }
  .conv input { font-family: var(--mono); font-size: 22px; }
  .cv-out { font-family: var(--mono); font-size: 24px; font-weight: 500; color: var(--accent); background: var(--bg); border-radius: 10px; padding: 12px; overflow-wrap: anywhere; text-align: right; display: flex; align-items: center; justify-content: flex-end; min-height: 52px; }
  .cv-out.err { color: var(--danger); font-family: var(--sans); font-size: 14px; }
  .cv-swap { justify-self: center; }
  .cv-all { display: grid; gap: 0; font-family: var(--mono); font-size: 13px; }
  .cv-all div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  .cv-all span:first-child { color: var(--muted); font-family: var(--sans); }
  .cv-all span:last-child { text-align: right; overflow-wrap: anywhere; }
  .cv-note { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .conv details summary { cursor: pointer; font-size: 13px; font-weight: 500; }
  .cv-rates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; margin-top: 8px; }
  .cv-rates label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  .cv-rates input { font-size: 13px; padding: 6px 8px; }
  .lab-form { display: grid; gap: 10px; }
  .lab-f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .lab-in { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 6px; }
  .conv .lab-f input { font-size: 18px; padding: 10px 12px; }
  .conv textarea { font-family: var(--mono); font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; resize: vertical; }
  .cv-all .em span:last-child { color: var(--accent); font-weight: 600; }
  .foot { grid-column: 1 / -1; color: var(--muted); font-size: 12px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { button.k { transition: none; } }
</style>

<main class="shell" id="shell">
  <section class="calc" aria-label="계산기">
    <div class="bar">
      <div class="modes" role="group" aria-label="계산 모드">
        <button type="button" id="mode-basic" data-mode="basic" aria-pressed="true">기본</button>
        <button type="button" id="mode-sci" data-mode="sci" aria-pressed="false">공학</button>
        <button type="button" id="mode-prog" data-mode="prog" aria-pressed="false">프로그래머</button>
        <button type="button" id="mode-fx" data-mode="fx" aria-pressed="false">환율</button>
        <button type="button" id="mode-unit" data-mode="unit" aria-pressed="false">단위</button>
        <button type="button" id="mode-lab" data-mode="lab" aria-pressed="false">연구</button>
        <button type="button" id="mode-acct" data-mode="acct" aria-pressed="false">회계</button>
      </div>
      <div style="display:flex; gap:6px;">
        <button type="button" class="pill" id="deg" hidden>Deg</button>
        <button type="button" class="pill" id="copy">복사</button>
      </div>
    </div>

    <div class="screen" id="screen" aria-live="polite">
      <div class="prev" id="prev"></div>
      <div class="expr" id="expr">0</div>
      <div class="live" id="live"></div>
      <div class="rpn" id="rpn"><b>후위</b>—</div>
      <div class="bases" id="bases" hidden></div>
    </div>

    <div id="baseSel" class="modes" role="group" aria-label="진법" hidden></div>
    <div class="keys six" id="hexKeys" hidden></div>
    <div class="keys" id="progOps" hidden></div>
    <div class="keys" id="sciKeys" hidden></div>
    <div class="keys" id="mainKeys"></div>
    <div class="conv" id="conv" hidden></div>
  </section>

  <aside class="history" id="histPanel" aria-label="계산 기록">
    <header><h2>계산 기록</h2><button type="button" class="pill" id="clearHist">지우기</button></header>
    <div id="histBox"></div>
  </aside>

  <p class="foot">입력한 수식은 토큰으로 나눈 뒤 후위 표기로 바꿔 계산합니다. 입력 중에도 결과가 미리 계산되고, <b>=</b>을 한 번 더 누르면 직전 연산이 반복됩니다. 키보드로도 입력할 수 있습니다.</p>
</main>

<script>
// ENGINE START
const FNS = ['sin', 'cos', 'tan', 'ln', 'log'];
const PREC_NUM = { '+': 1, '−': 1, '×': 2, '÷': 2, neg: 3, '^': 4 };
const PREC_INT = { '|': 1, '⊕': 2, '&': 3, '<<': 4, '>>': 4, '+': 5, '−': 5, '×': 6, '÷': 6, '%': 6, neg: 7, not: 7 };
const RIGHT = new Set(['^', 'neg', 'not']);
const DIGITS = '0123456789ABCDEF';

function tokenize(src, mode, base) {
  const s = src.replace(/\s+/g, '');
  const out = [];
  let i = 0;
  const intRe = mode === 'int' ? new RegExp('^[' + DIGITS.slice(0, base) + ']+', 'i') : null;
  while (i < s.length) {
    const c = s[i], rest = s.slice(i);
    let m;
    if (mode === 'num') {
      if ((m = /^(\d+\.?\d*|\.\d+)/.exec(rest))) { out.push({ t: 'num', v: parseFloat(m[1]), s: m[1] }); i += m[1].length; continue; }
      if ((m = /^(sin|cos|tan|ln|log)/.exec(rest))) { out.push({ t: 'fn', v: m[1], s: m[1] }); i += m[1].length; continue; }
      if (c === '√') { out.push({ t: 'fn', v: '√', s: '√' }); i++; continue; }
      if (c === 'π') { out.push({ t: 'num', v: Math.PI, s: 'π' }); i++; continue; }
      if (c === 'e') { out.push({ t: 'num', v: Math.E, s: 'e' }); i++; continue; }
      if (c === '!' || c === '%') { out.push({ t: 'post', v: c, s: c }); i++; continue; }
      if (c === '^') { out.push({ t: 'op', v: '^', s: '^' }); i++; continue; }
    } else {
      if ((m = intRe.exec(rest))) {
        const pre = base === 16 ? '0x' : base === 8 ? '0o' : base === 2 ? '0b' : '';
        out.push({ t: 'num', v: BigInt(pre + m[0]), s: m[0].toUpperCase() }); i += m[0].length; continue;
      }
      if (rest.startsWith('<<')) { out.push({ t: 'op', v: '<<', s: '<<' }); i += 2; continue; }
      if (rest.startsWith('>>')) { out.push({ t: 'op', v: '>>', s: '>>' }); i += 2; continue; }
      if (c === '~') { out.push({ t: 'not', v: '~', s: '~' }); i++; continue; }
      if (c === '%') { out.push({ t: 'op', v: '%', s: 'mod' }); i++; continue; }
      if (c === '&' || c === '|' || c === '⊕') { out.push({ t: 'op', v: c, s: c }); i++; continue; }
    }
    if (c === '+') { out.push({ t: 'op', v: '+', s: '+' }); i++; continue; }
    if (c === '−' || c === '-') { out.push({ t: 'op', v: '−', s: '−' }); i++; continue; }
    if (c === '×' || c === '*') { out.push({ t: 'op', v: '×', s: '×' }); i++; continue; }
    if (c === '÷' || c === '/') { out.push({ t: 'op', v: '÷', s: '÷' }); i++; continue; }
    if (c === '(') { out.push({ t: 'lp', s: '(' }); i++; continue; }
    if (c === ')') { out.push({ t: 'rp', s: ')' }); i++; continue; }
    throw new Error('알 수 없는 문자: ' + c);
  }
  return out;
}

function normalize(raw) {
  const out = [];
  const openers = ['op', 'neg', 'not', 'fn', 'lp'];
  for (let tk of raw) {
    const prev = out[out.length - 1];
    const noLeft = !prev || openers.includes(prev.t);
    if (tk.t === 'op' && noLeft) {
      if (tk.v === '−') tk = { t: 'neg', v: '−', s: '−' };
      else if (tk.v === '+') continue;
      else throw new Error('수식 오류');
    }
    if (tk.t === 'post' && noLeft) throw new Error('수식 오류');
    if (prev && ['num', 'post', 'rp'].includes(prev.t) && ['num', 'fn', 'lp', 'not'].includes(tk.t)) {
      out.push({ t: 'op', v: '×', s: '×' });
    }
    out.push(tk);
  }
  return out;
}

function toPostfix(tokens, mode) {
  const P = mode === 'num' ? PREC_NUM : PREC_INT;
  const out = [], st = [];
  let depth = 0;
  for (const tk of tokens) {
    if (tk.t === 'num' || tk.t === 'post') out.push(tk);
    else if (tk.t === 'fn' || tk.t === 'neg' || tk.t === 'not') st.push(tk);
    else if (tk.t === 'lp') { st.push(tk); depth++; }
    else if (tk.t === 'op') {
      const p = P[tk.v];
      while (st.length) {
        const top = st[st.length - 1];
        if (top.t === 'lp' || top.t === 'fn') break;
        const tp = P[top.t === 'op' ? top.v : top.t];
        if (tp > p || (tp === p && !RIGHT.has(tk.v))) out.push(st.pop()); else break;
      }
      st.push(tk);
    } else if (tk.t === 'rp') {
      if (!depth) throw new Error('괄호가 맞지 않습니다');
      while (st.length && st[st.length - 1].t !== 'lp') out.push(st.pop());
      st.pop(); depth--;
      if (st.length && st[st.length - 1].t === 'fn') out.push(st.pop());
    }
  }
  while (st.length) { const x = st.pop(); if (x.t !== 'lp') out.push(x); }
  return out;
}

const clean = (x) => (Math.abs(x) < 1e-12 ? 0 : x);
function applyNum(tk, a, b, deg) {
  switch (tk.v) {
    case '+': return a + b;
    case '−': return a - b;
    case '×': return a * b;
    case '÷': if (b === 0) throw new Error('0으로 나눌 수 없습니다'); return a / b;
    case '^': return Math.pow(a, b);
  }
}
function applyFn(name, a, deg) {
  const r = deg ? Math.PI / 180 : 1;
  switch (name) {
    case 'sin': return clean(Math.sin(a * r));
    case 'cos': return clean(Math.cos(a * r));
    case 'tan': {
      const t = Math.tan(a * r);
      if (Math.abs(t) > 1e14) throw new Error('정의되지 않습니다');
      return clean(t);
    }
    case 'ln': if (a <= 0) throw new Error('정의되지 않습니다'); return Math.log(a);
    case 'log': if (a <= 0) throw new Error('정의되지 않습니다'); return Math.log10(a);
    case '√': if (a < 0) throw new Error('음수의 제곱근은 계산할 수 없습니다'); return Math.sqrt(a);
  }
}
function applyInt(op, a, b) {
  let r;
  switch (op) {
    case '+': r = a + b; break;
    case '−': r = a - b; break;
    case '×': r = a * b; break;
    case '÷': if (b === 0n) throw new Error('0으로 나눌 수 없습니다'); r = a / b; break;
    case '%': if (b === 0n) throw new Error('0으로 나눌 수 없습니다'); r = a % b; break;
    case '&': r = a & b; break;
    case '|': r = a | b; break;
    case '⊕': r = a ^ b; break;
    case '<<': if (b < 0n || b > 63n) throw new Error('시프트 범위는 0~63입니다'); r = a << b; break;
    case '>>': if (b < 0n || b > 63n) throw new Error('시프트 범위는 0~63입니다'); r = a >> b; break;
  }
  return BigInt.asIntN(64, r);
}

function evalPostfix(rpn, mode, deg) {
  const s = [];
  const need = (n) => { if (s.length < n) throw new Error('수식이 완성되지 않았습니다'); };
  for (const tk of rpn) {
    if (tk.t === 'num') s.push(tk.v);
    else if (tk.t === 'neg') { need(1); s.push(mode === 'num' ? -s.pop() : BigInt.asIntN(64, -s.pop())); }
    else if (tk.t === 'not') { need(1); s.push(BigInt.asIntN(64, ~s.pop())); }
    else if (tk.t === 'fn') { need(1); s.push(applyFn(tk.v, s.pop(), deg)); }
    else if (tk.t === 'post') {
      need(1); const a = s.pop();
      if (tk.v === '%') s.push(a / 100);
      else {
        if (!Number.isInteger(a) || a < 0 || a > 170) throw new Error('팩토리얼은 0~170의 정수만 가능합니다');
        let f = 1; for (let k = 2; k <= a; k++) f *= k; s.push(f);
      }
    } else if (tk.t === 'op') {
      need(2); const b = s.pop(), a = s.pop();
      s.push(mode === 'num' ? applyNum(tk, a, b) : applyInt(tk.v, a, b));
    }
  }
  if (s.length !== 1) throw new Error('수식이 완성되지 않았습니다');
  const v = s[0];
  if (mode === 'num' && !Number.isFinite(v)) throw new Error('계산 범위를 벗어났습니다');
  return v;
}

function evaluate(expr, mode, base, deg) {
  const tokens = normalize(tokenize(expr, mode, base));
  if (!tokens.length) throw new Error('빈 수식');
  const rpn = toPostfix(tokens, mode);
  return { value: evalPostfix(rpn, mode, deg), rpn, tokens };
}

function fmtNum(v) {
  if (Object.is(v, -0)) v = 0;
  const r = parseFloat(v.toPrecision(12));
  const a = Math.abs(r);
  if (r !== 0 && (a >= 1e15 || a < 1e-6)) {
    const [m, e] = r.toExponential().split('e');
    return m + '×10^' + (e[0] === '+' ? e.slice(1) : e.replace('-', '−'));
  }
  return String(r).replace('-', '−');
}
function fmtInt(v, base) { return v.toString(base).toUpperCase().replace('-', '−'); }
// ENGINE END

(function () {
  const $ = (id) => document.getElementById(id);
  const state = { cv: { cat: '길이', amount: '1', from: 'USD', to: 'KRW' }, cvOut: '', mode: 'basic', base: 10, deg: true, expr: '', prev: '', fresh: false, rep: null, err: '', hist: [] };

  const calcMode = () => (state.mode === 'prog' ? 'int' : 'num');
  const base = () => (state.mode === 'prog' ? state.base : 10);
  const BINOPS = '+−×÷^&|⊕<>%';

  try { state.hist = JSON.parse(localStorage.getItem('pf-calc-hist') || '[]').slice(0, 30); } catch (e) { state.hist = []; }
  const saveHist = () => { try { localStorage.setItem('pf-calc-hist', JSON.stringify(state.hist)); } catch (e) {} };

  function ev(expr) { return evaluate(expr, calcMode(), base(), state.deg); }
  function show(v) { return calcMode() === 'num' ? fmtNum(v) : fmtInt(v, state.base); }
  function group(str) {
    if (calcMode() !== 'num' || /[×^e]/.test(str)) return str;
    const neg = str.startsWith('−'); const body = neg ? str.slice(1) : str;
    const [i, f] = body.split('.');
    return (neg ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
  }

  function preview() {
    let e = state.expr;

    {
      id: 'dtax', name: '법인세회계 (당기법인세 · 이연법인세 · 법인세비용)',
      note: '과세소득 = 회계이익 + 영구적차이 + 당기 일시적차이 조정(손금불산입은 +, 익금불산입은 −). 이연법인세자산 = 기말 차감할 일시적차이 × 미래 예상세율, 부채 = 가산할 일시적차이 × 미래세율입니다. 법인세비용 = 당기법인세 + 이연법인세부채 증가 − 이연법인세자산 증가. 실현가능성 판단(DTA 인식 한도)은 반영하지 않습니다.',

    {

    {

        const cand = [v.fvl, viu].filter((x) => x !== null && x !== undefined);

    {

    {

      note: '표준수량·표준시간(SQ, SH)은 실제 생산량에 허용된 표준투입량입니다. 가격(임률)차이 = (실제가격 − 표준가격) × 실제수량, 수량(능률)차이 = (실제수량 − 표준수량) × 표준가격. 양수는 불리(U), 음수는 유리(F)입니다. 재료는 구입량과 사용량이 같다고 가정합니다. 고정제조간접비 조업도차이는 예산 − 표준시간 × 고정배부율입니다.',

      note: '보조부문 S1, S2와 제조부문 P1, P2를 가정합니다. 용역 제공량(단위)을 각 부문별로 입력하세요(자기 부문 제공은 0). 단계배부법은 S1을 먼저 배부합니다(보통 용역 제공이 많거나 비용이 큰 부문 먼저). 상호배부법은 연립방정식으로 풉니다.',
      fields: [
        { k: 'c1', l: 'S1 부문비', d: '100000' }, { k: 'c2', l: 'S2 부문비', d: '80000' }, { k: 'p1', l: 'P1 부문비', d: '300000' }, { k: 'p2', l: 'P2 부문비', d: '200000' },
        { k: 'a2', l: 'S1이 S2에 제공한 용역', d: '20' }, { k: 'a3', l: 'S1이 P1에 제공', d: '40' }, { k: 'a4', l: 'S1이 P2에 제공', d: '40' },
        { k: 'b1', l: 'S2가 S1에 제공한 용역', d: '10' }, { k: 'b3', l: 'S2가 P1에 제공', d: '30' }, { k: 'b4', l: 'S2가 P2에 제공', d: '60' },
      ],
      compute(v) {
        const d1 = v.a3 + v.a4, d2 = v.b3 + v.b4;

        const dir = { P1: v.p1 + v.c1 * (v.a3 / d1) + v.c2 * (v.b3 / d2), P2: v.p2 + v.c1 * (v.a4 / d1) + v.c2 * (v.b4 / d2) };
        const t1 = v.a2 + v.a3 + v.a4, s2tot = v.c2 + v.c1 * (v.a2 / t1);
        const stp = { P1: v.p1 + v.c1 * (v.a3 / t1) + s2tot * (v.b3 / d2), P2: v.p2 + v.c1 * (v.a4 / t1) + s2tot * (v.b4 / d2) };
        const t2 = v.b1 + v.b3 + v.b4, f12 = v.a2 / t1, f21 = v.b1 / t2, den = 1 - f12 * f21;

        const x1 = (v.c1 + f21 * v.c2) / den, x2 = (v.c2 + f12 * v.c1) / den;

    {
      id: 'proc', name: '종합원가계산 (평균법 · 선입선출법)',

      fields: [
        { k: 'bq', l: '기초재공품 수량', d: '1000' }, { k: 'bmp', l: '기초 재료비 투입률 (%)', d: '100' }, { k: 'bcp', l: '기초 가공비 완성도 (%)', d: '40' },
        { k: 'bmc', l: '기초재공품 재료비', d: '200000' }, { k: 'bcc', l: '기초재공품 가공비', d: '90000' },
        { k: 'st', l: '당기 착수량', d: '9000' }, { k: 'done', l: '당기 완성품 수량', d: '8500' },
        { k: 'emp', l: '기말 재료비 투입률 (%)', d: '100' }, { k: 'ecp', l: '기말 가공비 완성도 (%)', d: '60' },
        { k: 'cmc', l: '당기 투입 재료비', d: '1800000' }, { k: 'ccc', l: '당기 투입 가공비', d: '1500000' },
      ],
      compute(v) {
        const eq = v.bq + v.st - v.done;

        const bm = v.bmp / 100, bc = v.bcp / 100, em = v.emp / 100, ec = v.ecp / 100;
        const avgEm = v.done + eq * em, avgEc = v.done + eq * ec;

        const fDone = v.bmc + v.bcc + v.bq * (1 - bm) * fMr + v.bq * (1 - bc) * fCr + (v.done - v.bq) * (fMr + fCr);
        const fEnd = eq * em * fMr + eq * ec * fCr, total = v.bmc + v.bcc + v.cmc + v.ccc;

      },
    },
    {

      compute(v) {

        const it = lines(v.items).map((ln, i) => {
          const p = ln.split(/\s+/); const o = { n: p[0], q: parseFloat(p[1]), pf: parseFloat(p[2]), ac: parseFloat(p[3]), ps: p[4] === undefined ? undefined : parseFloat(p[4]) };
          if (p.length < 4 || ![o.q, o.pf, o.ac].every(Number.isFinite) || o.q <= 0 || (o.ps !== undefined && !Number.isFinite(o.ps))) throw new Error(`${i + 1}번째 줄은 "이름 수량 최종단가 추가가공비 [분리점단가]" 형식입니다`);
          if (o.ps === undefined) o.ps = o.pf;

        });
        const sum = (f) => it.reduce((s, x) => s + f(x), 0), by = (f) => { const t = sum(f); return it.map((x) => (v.jc * f(x)) / t); };
        const phys = by((x) => x.q), split = by((x) => x.q * x.ps), nrv = by((x) => x.q * x.pf - x.ac);
        const rev = sum((x) => x.q * x.pf), acT = sum((x) => x.ac), gpr = (rev - v.jc - acT) / rev;

        let tb;

          if (v.price === null || v.bv === null || v.n === null || v.k === null) throw new Error('유형자산 항목을 입력하세요');
          const n = Math.round(v.n), k = Math.round(v.k);
          if (n < 1 || k < 1 || k > n) throw new Error('잔존내용연수와 경과연수를 확인하세요 (1 ≤ 경과 ≤ 연수)');
          const gain = v.price - v.bv;
          end = gain * (1 - k / n); beg = k === 1 ? 0 : gain * (1 - (k - 1) / n);
          rows.push(['양도차익 (내부 미실현)', money(gain)], ['연 실현액 (감가상각비 과대분 환입)', money(gain / n)], ['기초 미실현이익', money(beg)], ['기말 미실현이익', money(end)]);
        }
        const eff = -(end - beg) * (1 - t), dta = (end - beg) * t;
        rows.push(['당기 연결순이익 효과 (세후)', gl(eff), true]);
        if (t > 0) rows.push(['이연법인세자산 증감', money(dta)]);
        if (v.dir === 'down') rows.push(['  지배기업 귀속', gl(eff)], ['  비지배지분 귀속', '0']);
        else rows.push(['  지배기업 귀속', gl(eff * p)], ['  비지배지분 귀속', gl(eff * (1 - p))]);
        return { rows };
      },
    },
    {
      id: 'step', name: '연결 ③ 단계취득 (기존지분 재측정 · 영업권)',
      note: '지배력을 얻는 시점에 기존 보유지분을 공정가치로 재측정해 평가손익을 당기손익으로 인식하고(이전에 OCI로 인식한 금액은 해당 자산의 처분 기준에 따름), 영업권 = 추가 이전대가 + 기존지분 공정가치 + 비지배지분 − 식별가능순자산 공정가치로 계산합니다.',
      fields: [
        { k: 'pp', l: '기존 보유지분율 (%)', d: '20' }, { k: 'pbv', l: '기존 보유지분 장부금액', d: '1800000' }, { k: 'pfv', l: '기존 보유지분 공정가치', d: '2200000' },
        { k: 'ap', l: '추가 취득지분율 (%)', d: '40' }, { k: 'ac', l: '추가 취득 대가', d: '4600000' },
        { k: 'na', l: '식별가능순자산 공정가치 (100%)', d: '10000000' },
        { k: 'mth', l: '비지배지분 측정', t: 'sel', d: 'prop', opts: [['prop', '비례지분'], ['fv', '공정가치']] }, { k: 'ncifv', l: '비지배지분 공정가치', d: '', opt: true },
      ],
      compute(v) {
        positive(v, ['pp', 'ap', 'na']);
        const tp = v.pp + v.ap;
        if (tp > 100 || tp <= 50) throw new Error('합계 지분율은 50% 초과 100% 이하여야 합니다(지배력 획득)');
        const nci = v.mth === 'prop' ? (1 - tp / 100) * v.na : v.ncifv;
        if (nci === null) throw new Error('비지배지분 공정가치를 입력하세요');
        const gw = v.ac + v.pfv + nci - v.na;
        return { rows: [['기존지분 재측정 평가손익 (당기손익)', gl(v.pfv - v.pbv), true], ['총 이전대가 (추가대가 + 기존지분 공정가치)', money(v.ac + v.pfv)], ['비지배지분', money(nci)], [gw >= 0 ? '영업권' : '염가매수차익', money(Math.abs(gw)), true], ['취득 후 지배지분율', tp + ' %']] };
      },
    },
    {
      id: 'ncieq', name: '연결 ④ 지배력 유지 지분거래 (자본거래)',
      note: '지배력을 유지한 채 종속기업 지분을 추가 취득하거나 일부 처분하면 자본거래입니다. 비지배지분을 조정하고, 대가와 조정액의 차이는 당기손익이 아니라 자본(지배기업 소유주 귀속)으로 처리합니다. 조정액 = 처분(취득) 지분율 × 종속기업 순자산(영업권 제외, 비지배지분 비례지분법 기준)입니다.',
      fields: [
        { k: 'kind', l: '거래', t: 'sel', d: 'sell', opts: [['sell', '일부 처분 (비지배지분 증가)'], ['buy', '추가 취득 (비지배지분 감소)']] },
        { k: 'x', l: '거래 지분율 (%포인트)', d: '10' }, { k: 'na', l: '종속기업 순자산 (공정가치 조정 반영, 영업권 제외)', d: '10000000' }, { k: 'pay', l: '거래 대가 (수취/지급)', d: '1500000' },
      ],
      compute(v) {
        positive(v, ['x', 'na', 'pay']);
        const adj = (v.x / 100) * v.na, diff = v.kind === 'sell' ? v.pay - adj : adj - v.pay;
        return { rows: [['비지배지분 ' + (v.kind === 'sell' ? '증가' : '감소') + '액', money(adj), true], ['자본 조정 (자본잉여금 등)', (diff >= 0 ? '증가 ' : '감소 ') + money(Math.abs(diff)), true], ['당기손익 영향', '없음 (자본거래)']] };
      },
    },
    {
      id: 'ctrl', name: '연결 ⑤ 지배력 상실 (처분손익 · 잔여지분)',
      note: '지배력 상실 시 종속기업의 자산·부채(영업권 포함)와 비지배지분 장부금액을 제거하고, 받은 대가와 잔여지분 공정가치를 인식하며 차이를 당기손익으로 처리합니다. 종속기업과 관련해 OCI에 누적된 금액은 당기손익으로 재분류합니다(처분 시 재분류 대상인 항목, 예: 해외사업장환산차이). 잔여지분은 공정가치로 재측정합니다.',
      fields: [
        { k: 'cons', l: '처분대가', d: '6000000' }, { k: 'rfv', l: '잔여지분 공정가치', d: '1500000', opt: true },
        { k: 'na', l: '종속기업 순자산 (연결상 장부, 영업권 제외, 100%)', d: '9000000' }, { k: 'gw', l: '영업권 장부금액', d: '500000', opt: true },
        { k: 'nci', l: '비지배지분 장부금액', d: '1800000' }, { k: 'oci', l: '재분류할 누적 OCI (이익 +, 손실 −)', d: '100000', opt: true },
      ],
      compute(v) {
        const rfv = optN(v.rfv, 0), gw = optN(v.gw, 0), oci = optN(v.oci, 0);
        const gain = v.cons + rfv + oci - (v.na + gw - v.nci);
        return { rows: [['제거하는 지배기업 귀속 순자산 + 영업권', money(v.na + gw - v.nci)], ['받은 대가 + 잔여지분 공정가치', money(v.cons + rfv)], ['재분류 OCI', gl(oci)], ['지배력 상실 처분손익 (당기손익)', gl(gain), true], ['잔여지분 재측정 이익 (포함액)', rfv > 0 ? '잔여지분 공정가치가 새 장부금액 (' + money(rfv) + ')' : '잔여지분 없음']] };
      },
    },
  ];
  ATOOLS3.forEach((t) => ATOOLS.push(t));
  (() => {
    const i = AGROUPS.findIndex((g) => g[0] === '재무회계');
    AGROUPS.splice(i + 1, 0, ['외화환산 (K-IFRS 1021)', ['fxm', 'fxn', 'fxs', 'fxh']], ['연결회계 (K-IFRS 1110 · 1103)', ['cons', 'intg', 'step', 'ncieq', 'ctrl']]);
  })();
  // ACCT3 END

  const labState = { tool: 'dil', atool: 'tvm', vals: {} };
  try { Object.assign(labState, JSON.parse(localStorage.getItem('pf-lab') || '{}')); } catch (e) {}
  const saveLab = () => { try { localStorage.setItem('pf-lab', JSON.stringify({ tool: labState.tool, atool: labState.atool, vals: labState.vals })); } catch (e) {} };
  const labEl = { ctl: {} };
  const suite = () => (state.mode === 'acct'
    ? { tools: ATOOLS, groups: AGROUPS, get: () => labState.atool, set: (x) => { labState.atool = x; } }
    : { tools: TOOLS, groups: GROUPS, get: () => labState.tool, set: (x) => { labState.tool = x; } });
  const SCI_NUM = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;
  function parseNum(raw) {
    if (SCI_NUM.test(raw)) return parseFloat(raw);
    try { const r = evaluate(raw, 'num', 10, true).value; return typeof r === 'number' ? r : null; } catch (e) { return null; }
  }
  function readLab(tool) {
    const v = {};
    for (const f of tool.fields) {
      const c = labEl.ctl[f.k];
      const raw = c.input.value.trim();
      if (f.t === 'sel') { v[f.k] = c.input.value; continue; }
      if (f.t === 'text' || f.t === 'area') {
        if (!raw && !f.opt) throw new Error(f.l + ' 값을 입력하세요');
        v[f.k] = raw; continue;
      }
      if (!raw) { if (!f.opt) throw new Error(f.l + ' 값을 입력하세요'); v[f.k] = null; continue; }
      const n = parseNum(raw);
      if (n === null) throw new Error(f.l + ' 값을 확인하세요');
      v[f.k] = f.u ? n * LU[f.u][c.unit.value] : n;
    }
    return v;
  }
  function updateLab() {
    const S = suite();
    const tool = S.tools.find((t) => t.id === S.get());
    const saved = (labState.vals[tool.id] = {});
    tool.fields.forEach((f) => {
      const c = labEl.ctl[f.k];
      saved[f.k] = c.input.value;
      if (c.unit) saved[f.k + '_u'] = c.unit.value;
    });
    saveLab();
    try {
      const r = tool.compute(readLab(tool));
      labEl.res.replaceChildren(...r.rows.map(([l, val, em]) => h('div', { className: em ? 'em' : '' }, h('span', { textContent: l }), h('span', { textContent: val }))));
      labEl.dyn.textContent = (r.notes || []).join(' ');
      state.cvOut = r.rows.map((x) => x[0] + ': ' + x[1]).join('\n');
    } catch (e) {
      labEl.res.replaceChildren(h('div', { className: 'cv-out err', textContent: e.message }));
      labEl.dyn.textContent = '';
      state.cvOut = '';
    }
  }
  function buildLab() {
    const S = suite();
    if (!S.tools.some((t) => t.id === S.get())) S.set(S.tools[0].id);
    const tool = S.tools.find((t) => t.id === S.get());
    const sel = h('select', { id: 'labTool' });
    sel.setAttribute('aria-label', '계산 도구');
    S.groups.forEach(([g, ids]) => {
      const og = h('optgroup', { label: g });
      ids.forEach((id) => og.append(h('option', { value: id, textContent: S.tools.find((t) => t.id === id).name })));
      sel.append(og);
    });
    sel.value = tool.id;
    sel.addEventListener('change', () => { S.set(sel.value); buildLab(); });
    const saved = labState.vals[tool.id] || {};
    const form = h('div', { className: 'lab-form' });
    labEl.ctl = {};
    tool.fields.forEach((f) => {
      let input;
      if (f.t === 'sel') {
        input = h('select', {});
        input.append(...f.opts.map(([val, l]) => h('option', { value: val, textContent: l })));
        input.value = saved[f.k] ?? f.d;
      } else if (f.t === 'area') {
        input = h('textarea', { rows: 2 });
        input.value = saved[f.k] ?? f.d ?? '';
      } else {
        input = h('input', { type: 'text' });
        input.inputMode = f.t === 'text' ? 'text' : 'decimal';
        input.value = saved[f.k] ?? f.d ?? '';
      }
      input.id = 'lab-' + tool.id + '-' + f.k;
      input.autocomplete = 'off';
      input.addEventListener('input', updateLab);
      input.addEventListener('change', updateLab);
      let unit = null;
      if (f.u) {
        unit = h('select', {});
        unit.setAttribute('aria-label', f.l + ' 단위');
        unit.append(...Object.keys(LU[f.u]).map((k) => h('option', { value: k, textContent: k })));
        unit.value = saved[f.k + '_u'] ?? f.du;
        unit.addEventListener('change', updateLab);
      }
      labEl.ctl[f.k] = { input, unit };
      form.append(h('label', { className: 'lab-f', htmlFor: input.id }, h('span', { textContent: f.l + (f.opt ? ' (선택)' : '') }), unit ? h('div', { className: 'lab-in' }, input, unit) : input));
    });
    labEl.res = h('div', { className: 'cv-all' });
    labEl.res.setAttribute('aria-live', 'polite');
    labEl.dyn = h('p', { className: 'cv-note' });
    $('conv').replaceChildren(sel, form, labEl.res, labEl.dyn, h('p', { className: 'cv-note', textContent: tool.note }));
    updateLab();
  }

  // ---- 이벤트
  document.querySelectorAll('.modes [data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $('deg').addEventListener('click', () => { state.deg = !state.deg; $('deg').textContent = state.deg ? 'Deg' : 'Rad'; render(); });
  $('clearHist').addEventListener('click', () => { state.hist = []; saveHist(); renderHist(); });
  $('copy').addEventListener('click', () => {
    const txt = isConvMode() ? state.cvOut : state.expr || '';
    const btn = $('copy');
    const done = (ok) => { btn.textContent = ok ? '복사됨' : '복사 실패'; setTimeout(() => (btn.textContent = '복사'), 1200); };
    try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (e) { done(false); }
  });

  document.addEventListener('keydown', (ev2) => {
    if (ev2.ctrlKey || ev2.metaKey || ev2.altKey) return;
    if (isConvMode() || /^(INPUT|SELECT|TEXTAREA)$/.test(ev2.target.tagName)) return;
    const k = ev2.key, prog = state.mode === 'prog';
    if (/^[0-9]$/.test(k)) { if (!prog || DIGITS.indexOf(k) < state.base) press('value', k); }
    else if (prog && /^[a-fA-F]$/.test(k)) { if (DIGITS.indexOf(k.toUpperCase()) < state.base) press('value', k.toUpperCase()); }
    else if (k === '.') { if (!prog) press('value', '.'); }
    else if (k === '+') press('op', '+');
    else if (k === '-') press('op', '−');
    else if (k === '*') press('op', '×');
    else if (k === '/') { ev2.preventDefault(); press('op', '÷'); }
    else if (k === '^') press('op', prog ? '⊕' : '^');
    else if (k === '&' || k === '|') { if (prog) press('op', k); }
    else if (k === '~') { if (prog) press('value', '~'); }
    else if (k === '%') press(prog ? 'op' : 'post', '%');
    else if (k === '!') { if (!prog) press('post', '!'); }
    else if (k === '(') press('value', '(');
    else if (k === ')') press('raw', ')');
    else if (k === 'Enter' || k === '=') { ev2.preventDefault(); press('eq'); }
    else if (k === 'Backspace') press('back');
    else if (k === 'Escape' || k === 'Delete') press('clear');
    else return;
  });

  render();
})();
</script>

</html>
